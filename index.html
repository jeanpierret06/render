    <style>
        /* Base y Fondo de Seguridad */
        body {
            background-color: #030108;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            color: #fff;
            padding: 20px;
            position: relative;
            margin: 0;
        }

        /* LIENZO DE ANIMACIÓN DIGITAL */
        #cyber-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Líneas de escaneo retro */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
            z-index: 1;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* CONTENEDOR PRINCIPAL */
        .form-container {
            background: rgba(8, 4, 18, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid #00f0ff;
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            z-index: 2;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.05);
            animation: ultraEntrance 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards, neonGlow 4s ease-in-out infinite alternate;
        }

        @keyframes ultraEntrance {
            0% {
                transform: scale(0.3) rotate(-15deg) translateY(-500px);
                opacity: 0;
                filter: blur(20px) brightness(3);
                border-color: #ff0055;
            }

            60% {
                transform: scale(1.05) rotate(2deg) translateY(30px);
                opacity: 1;
                filter: blur(0px) brightness(1.5);
                border-color: #ff0055;
            }

            85% {
                transform: scale(0.98) rotate(-1deg) translateY(-10px);
                border-color: #00f0ff;
            }

            100% {
                transform: scale(1) rotate(0deg) translateY(0);
                opacity: 1;
            }
        }

        @keyframes neonGlow {
            0% {
                border-color: #00f0ff;
                box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            }

            50% {
                border-color: #7000ff;
                box-shadow: 0 0 40px rgba(112, 0, 255, 0.3);
            }

            100% {
                border-color: #ff0055;
                box-shadow: 0 0 30px rgba(255, 0, 85, 0.2);
            }
        }

        .glitch-title {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 2px 2px #ff0055, -2px -2px #00f0ff;
            animation: glitchEffect 1s linear infinite alternate, fadeInDown 0.8s ease-out;
            margin-bottom: 35px;
        }

        @keyframes glitchEffect {
            0% {
                text-shadow: 2px 2px #ff0055, -2px -2px #00f0ff;
                transform: skewX(0deg);
            }

            20% {
                text-shadow: -3px 1px #ff0055, 2px -3px #00f0ff;
                transform: skewX(-2deg);
            }

            40% {
                text-shadow: 1px -2px #ff0055, -1px 3px #00f0ff;
                transform: skewX(1deg);
            }

            60% {
                text-shadow: 3px 3px #ff0055, -3px -1px #00f0ff;
                transform: skewX(-1deg);
            }

            80% {
                text-shadow: -2px -2px #ff0055, 2px 2px #00f0ff;
                transform: skewX(2deg);
            }

            100% {
                text-shadow: 2px -1px #ff0055, -2px 3px #00f0ff;
                transform: skewX(0deg);
            }
        }

        .form-label {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #00f0ff;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #fff;
            border-radius: 6px;
            padding: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-control:focus {
            background: rgba(0, 240, 255, 0.08);
            border-color: #ff0055;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4), inset 0 0 10px rgba(255, 0, 85, 0.2);
            transform: scale(1.02) translateX(5px);
        }

        .form-group-animated {
            opacity: 0;
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .fg-1 {
            animation-delay: 0.4s;
        }

        .fg-2 {
            animation-delay: 0.5s;
        }

        .fg-3 {
            animation-delay: 0.6s;
        }

        .fg-4 {

        }

        .fg-5 {
            animation-delay: 0.8s;
        }

        .fg-6 {
            animation-delay: 0.9s;
        }

        /* BOTÓN PRINCIPAL (MAGENTA) */

            background: transparent;
            border: 2px solid #ff0055;
            color: #ff0055;

            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;

            margin-top: 25px;

        .btn-tryhard:hover {

        /* BOTÓN CONSULTA DE LISTADOS (CIAN ULTRA) */

    <script>
        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Configuración de las corrientes de datos del backend virtual
        const columnCount = Math.floor(canvas.width / 20);
        const streams = [];

        for (let i = 0; i < columnCount; i++) {
            streams.push({
                x: i * 25 + Math.random() * 15,
                y: Math.random() * canvas.height,
                speed: 1.5 + Math.random() * 3,
                length: 40 + Math.random() * 120,
                color: Math.random() > 0.5 ? '#00f0ff' : '#ff0055'
            });
        }

        function drawCyberBackground() {
            // Capa de desvanecimiento sutil para dejar estela fluida
            ctx.fillStyle = 'rgba(3, 1, 8, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Renderizado de ráfagas binarias verticales
            for (let i = 0; i < streams.length; i++) {
                const stream = streams[i];

                // Dibujar línea de datos de alta velocidad
                ctx.beginPath();
                let gradient = ctx.createLinearGradient(stream.x, stream.y, stream.x, stream.y + stream.length);
                gradient.addColorStop(0, 'transparent');
                gradient.addColorStop(1, stream.color);

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 1.5;
                ctx.moveTo(stream.x, stream.y);
                ctx.lineTo(stream.x, stream.y + stream.length);
                ctx.stroke();

                // Actualizar posiciones físicas del hilo animado
                stream.y += stream.speed;

                // Reset de bucle infinito si sale de la matriz de pantalla
                if (stream.y > canvas.height) {
                    stream.y = -stream.length;
                    stream.x = Math.random() * canvas.width;
                    stream.speed = 1.5 + Math.random() * 3;
                }
            }

            requestAnimationFrame(drawCyberBackground);
        }

        // Ejecutar bucle del render del sistema principal
        drawCyberBackground();
    </script>
